[project]
name = "web-search-agent"
version = "0.1.0"
description = "Search API and public web crawling adapters for evidence collection"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.28.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
playwright = [
    "playwright==1.57.0",
    "playwright-stealth>=2.0.3,<3",
]
selenium = ["selenium>=4.20.0"]
stealth = [
    "curl-cffi>=0.7,<1",
    "nodriver>=0.48,<0.51",
    "platformdirs>=4.0",
]
sentiment = [
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.21,<1",
]
sentiment-build = [
    "huggingface-hub>=0.28,<1",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
    "pandas>=2.2,<3",
    "pyarrow>=18,<24",
    "scikit-learn>=1.6,<2",
    "torch>=2.4,<3",
    "transformers>=4.48,<5",
]
article-cluster = [
    "numpy>=1.26,<3",
    "sentence-transformers>=3.0,<6",
]
dev = ["pytest>=8.0.0"]

[project.scripts]
web-search-agent = "core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "enterpriseDB"]
